apply plugin: 'com.android.application'

// Release signing. Play will not accept a bundle signed with the debug key,
// and the real key must never be in the repository - so it is read from
// android/keystore/, which .gitignore excludes.
//
// When the file is absent the release build is left unsigned rather than
// failing: a checkout without the key can still compile and run the debug
// variant, which is what CI and a fresh clone actually need.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
def hasSigningKey = keystorePropertiesFile.exists()

if (hasSigningKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.dijytal.littlekrishnasbutterhunt"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dijytal.littlekrishnasbutterhunt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // The one place the version is written. vite.config.js reads
        // versionName back out of this file so the About box cannot say a
        // different number from the one Play shows - it said 1.0 for two
        // releases running, because it was a string typed into a dialog.
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningKey) {
            release {
                storeFile rootProject.file("keystore/${keystoreProperties['storeFile']}")
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']

                // v2 only, and that is complete coverage here: v1 is JAR
                // signing, which is needed solely by Android below 7.0, and
                // minSdk is 24 - which is 7.0. AGP drops v1 on its own at
                // this minSdk even when asked for it, so asking would only
                // put a claim in this file that the built artifact does not
                // back up.
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            // Left off deliberately. The whole game is JavaScript inside a
            // WebView, so R8 has almost nothing of ours to shrink - it would
            // only strip Capacitor's bridge classes, which are reached by
            // reflection from JavaScript and so look unused to it. The saving
            // is a fraction of a 9MB bundle that is nearly all art and audio;
            // the failure mode is a blank white screen on launch.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }

            // Play rejects a debuggable release outright
            debuggable false
        }
    }

    // Trims the bundle Play generates for each device: without this every
    // phone downloads every density of the launcher icon and splash.
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
